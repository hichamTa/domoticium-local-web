name: "Domoticium — Accès local"
description: >
  Interface web locale de Domoticium — pilotage des équipements, alarme et
  caméras directement depuis le réseau du site, sans passer par le cloud.
  Fonctionne même sans connexion internet. Nécessite l'add-on Domoticium
  principal déjà installé et configuré sur ce Home Assistant (qui installe
  celui-ci automatiquement).
version: "0.3.22"
slug: "domoticium_web"
init: false
# armv7 retiré (2026-09-08) : un build Next.js complet sous QEMU armv7 est
# resté bloqué 35+ minutes sans jamais finir côté GitHub Actions (contre
# quelques minutes pour arm64/amd64 dans les MÊMES runs) — sans impact réel,
# tout Raspberry Pi encore vendu (3B+/4/5) tourne HAOS en 64 bits par
# défaut. Retiré ici aussi (pas seulement du workflow qui construit
# l'image) pour ne jamais proposer l'installation sur un matériel pour
# lequel aucune image n'existe.
arch:
  - aarch64
  - amd64
startup: "application"
boot: "auto"
host_network: true
# Image déjà construite, publiée par hichamTa/domoticium-web (dépôt PRIVÉ —
# son code source n'est jamais exposé ici ni nulle part de public) via
# .github/workflows/publish-addon-image.yml à chaque changement de code réel.
# Un seul tag multi-architecture (arm64/amd64 construits ensemble via
# buildx) — Docker résout automatiquement la bonne variante selon le
# processeur du Pi, pas besoin du gabarit {arch}.
image: "ghcr.io/hichamta/domoticium-web"
options:
  ingest_secret: ""
  site_prefix: ""
  # 2026-09-08, chantier caméras locales : mot de passe API go2rtc, transmis
  # automatiquement par install_local_web_addon() (main.py) — même mécanisme
  # que ingest_secret, jamais saisi à la main par Hicham.
  go2rtc_password: ""
schema:
  ingest_secret: str
  site_prefix: str
  go2rtc_password: str
